name: skills checks

# Every pull request, whatever it touches: the hooks, shims, installers,
# mods and manifests are checked here too, not only skills/.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  fast:
    # Generated indices in sync, references in the template, findings
    # schema, budget table, manifests and version pins, the hook tests,
    # shellcheck over every shell script. No network.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: shellcheck --version   # preinstalled on the runner image; fail here if not
      - run: tools/check-all.sh

  mods:
    # Each mod's manifest, module and tests, against the Claude Code
    # engine itself (needs no sign-in). The latest engine, not a pin:
    # that is what users load the mods into. Type-checking stays local,
    # since the engine writes a mod's tsconfig and types only when a
    # session loads it (mods/README.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: curl -fsSL https://claude.ai/install.sh | bash
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: claude --version
      - run: tools/check-mods.sh

  full:
    # Every rbt flag and reboot symbol against the pinned Reboot, the
    # three templates built from scratch with their scenarios run, and
    # the stylesheet page rendered in a browser.
    runs-on: ubuntu-latest
    needs: fast
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: tools/check-all.sh --full

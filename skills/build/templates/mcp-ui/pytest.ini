[pytest]
testpaths = tests
pythonpath =
  backend/src
  backend/api
  api
  scripts
# A scenario that hangs (the harness waiting for the app, a lock never
# released) fails on its own after this many seconds instead of stalling
# the run (pytest-timeout). Setup counts: a hung Reboot().up() fails too.
timeout = 300
# Reboot 1.6.0's dependencies warn on every run (websockets, pydantic
# settings); none of it is the app's. Anything else still shows.
filterwarnings =
    ignore:websockets.legacy is deprecated:DeprecationWarning
    ignore:websockets.server.WebSocketServerProtocol is deprecated:DeprecationWarning
    ignore:Field 'lifespan' has an incomplete definition
# Tags as markers (scripts/test.sh): @smoke on the few scenarios a quick
# pass runs, @browser on a feature file of browser scenarios, and one
# @<area> per feature file; register each area below.
markers =
    smoke: the scenarios a quick pass runs (scripts/test.sh smoke)
    browser: browser scenarios (scripts/test.sh backend leaves them out)

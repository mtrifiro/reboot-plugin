# .mypy.ini — documented at
#   https://mypy.readthedocs.io/en/stable/config_file.html
[mypy]
warn_unused_configs = True

# Find modules in our source tree (and tests). Since `protoc` doesn't
# generate `__init__.py` files, treat these as explicit package bases:
#   https://mypy.readthedocs.io/en/stable/running_mypy.html#mapping-file-paths-to-modules
mypy_path = tests:backend/src:backend/api:api
explicit_package_bases = True

# Stricter than the default, but cheap to adhere to and high value.
check_untyped_defs = True
strict_equality = True

# gRPC stubs ship incomplete type info; don't flag them.
[mypy-google.api.*]
ignore_missing_imports = True
[mypy-google.rpc.*]
ignore_missing_imports = True
[mypy-grpc.*]
ignore_missing_imports = True
[mypy-grpc_status.*]
ignore_missing_imports = True

# The generated `*_rbt.py` for the API package is not hand-written;
# don't type-check it (you never edit it anyway). Repeat per API
# module. Name the generated module specifically — a blanket
# `__app__.v1.*` would also silence the hand-written
# `api/__app__/v1/__app__.py`, and with it every state and request
# model your code is annotated with.
[mypy-__app__.v1.__app___rbt]
ignore_errors = True
ignore_missing_imports = True
